# GPU MachineSet Parameters for AWS g4dn.xlarge
# Edit these values to customize your GPU nodes

# Instance configuration
instanceType: g4dn.xlarge         # NVIDIA T4 GPU
replicas: 1                       # Number of GPU nodes (increase for multiple demos)

# Note: Availability zone and region are auto-detected from your cluster
# via the cluster-info-aws ConfigMap. No manual configuration needed!

# GPU details for this instance type:
# - 1x NVIDIA T4 (16GB GDDR6)
# - 4 vCPUs
# - 16 GB RAM
# - Cost: ~$0.526/hour (on-demand, us-east-1)
# - Good for: Small to medium models, cost-effective inference, embedding models
#
# Common scenarios:
# - replicas: 1 - Single small model or embedding service
# - replicas: 2 - Multiple small models or high-availability setup
# - replicas: 3+ - Distributed inference or multiple concurrent workloads
#
# Perfect for:
# - Embedding models (Qwen3-VL-Embedding-2B, sentence-transformers)
# - Small language models (7B and below)
# - Cost-conscious development and testing
