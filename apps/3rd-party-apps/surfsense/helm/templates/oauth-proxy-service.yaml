apiVersion: v1
kind: Service
metadata:
  name: surfsense-oauth-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: surfsense
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  ports:
    - port: 8443
      targetPort: oauth-proxy
      protocol: TCP
      name: oauth-proxy
  selector:
    app: surfsense
