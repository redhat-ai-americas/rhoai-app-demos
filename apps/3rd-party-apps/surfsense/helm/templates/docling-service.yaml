{{- if .Values.docling.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: docling-service
  namespace: {{ .Values.namespace }}
  labels:
    app: docling
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.docling.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: docling
{{- end }}
