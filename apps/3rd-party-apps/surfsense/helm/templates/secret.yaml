apiVersion: v1
kind: Secret
metadata:
  name: surfsense-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: surfsense
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  # Database credentials
  postgres-password: {{ .Values.postgresql.password | default (randAlphaNum 32) | quote }}
  database-url: {{ printf "postgresql://%s:$(POSTGRES_PASSWORD)@postgresql-service:5432/%s" .Values.postgresql.username .Values.postgresql.database | quote }}
  
  # JWT secret key for authentication
  secret-key: {{ randAlphaNum 64 | quote }}
  
  # Google OAuth (if configured)
{{- if .Values.auth.googleClientId }}
  google-client-id: {{ .Values.auth.googleClientId | quote }}
  google-client-secret: {{ .Values.auth.googleClientSecret | quote }}
{{- end }}
  
  # Web search API key (if using external provider)
{{- if and .Values.webSearch.enabled .Values.webSearch.apiKey }}
  web-search-api-key: {{ .Values.webSearch.apiKey | quote }}
{{- end }}
  
  # LLM API key (if configured)
{{- if .Values.llm.apiKey }}
  llm-api-key: {{ .Values.llm.apiKey | quote }}
{{- end }}
